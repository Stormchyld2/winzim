name: Build CindrixRecon

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: |
          python tests/test_local.py
          python tests/test_zimit_engine.py
          python tests/test_sitecheck.py
          python tests/test_features.py
          python tests/test_detail.py
          python tests/test_books.py
          python tests/test_bookzim.py
          python tests/test_zimlibrary.py
          python tests/test_settings_logic.py
          python tests/test_cache.py
          python tests/test_drivereport.py
          python tests/test_jobqueue.py
          python tests/test_starterlib.py
          python tests/test_app_logic.py
          python tests/test_bookui_logic.py
      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name CindrixRecon app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CindrixRecon-exe
          path: dist/CindrixRecon.exe
