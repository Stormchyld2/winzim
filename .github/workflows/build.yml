name: Build WinZim

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: |
          python tests/test_local.py
          python tests/test_zimit_engine.py
          python tests/test_sitecheck.py
          python tests/test_features.py
          python tests/test_detail.py
          python tests/test_app_logic.py
      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name WinZim app.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: WinZim-exe
          path: dist/WinZim.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WinZim-installer
          path: installer/WinZim-Setup.exe
